*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;
  --cyan:#00d4ff;
  --green:#3fb950;
  --gold:#f59e0b;
  --red:#ff5f57;
  --yellow:#febc2e;
  --dim:#1e4620;
  --muted:#4a9e5c;
  --txt:#c9d1d9;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:14px}

/* CRT scanlines */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);
}
/* Vignette */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:998;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.7) 100%);
}

#bg-canvas{position:fixed;inset:0;z-index:0;opacity:.18}

/* Matrix overlay */
#matrix-overlay{display:none;position:fixed;inset:0;z-index:100;background:#000}
#matrix-overlay.active{display:block}
#matrix-canvas{width:100%;height:100%}
#matrix-hint{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  color:var(--green);font-size:12px;animation:blink 1s step-end infinite;
}

/* Terminal */
#terminal{
  position:relative;z-index:10;
  display:flex;flex-direction:column;
  height:100vh;max-width:900px;margin:0 auto;
}

/* Title bar */
#term-bar{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:rgba(30,30,30,.95);
  border-bottom:1px solid rgba(0,212,255,.2);
  user-select:none;
}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:var(--red)}
.dot.y{background:var(--yellow)}
.dot.g{background:var(--green)}
#term-title{margin:0 auto;color:rgba(255,255,255,.5);font-size:12px;letter-spacing:.5px}

/* Output */
#output{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 16px 6px;
  scroll-behavior:smooth;
}
#output::-webkit-scrollbar{width:4px}
#output::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}

/* Input row */
#input-row{
  flex-shrink:0;display:flex;align-items:center;
  padding:8px 16px 10px;
  border-top:1px solid rgba(0,212,255,.1);
  background:rgba(0,0,0,.6);
}
.p-user{color:var(--cyan)}
.p-host{color:var(--green)}
.p-sym{color:var(--cyan);margin-right:6px}
.p-sep{color:#4a9e5c}
#cmd-input{

  color:var(--txt);font-family:inherit;font-size:14px;caret-color:var(--green);
}

/* Quick bar */
#quick-bar{
  display:none;flex-shrink:0;flex-wrap:wrap;gap:6px;
  padding:8px 10px;
  background:rgba(10,10,10,.95);
  border-top:1px solid rgba(0,212,255,.15);
}
@media(max-width:640px){

.qbtn{

  background:rgba(0,212,255,.06);color:var(--cyan);

.qbtn:hover,.qbtn:active{background:rgba(0,212,255,.18);border-color:var(--cyan)}

/* Line types */
.line{display:block;white-space:pre-wrap;word-break:break-word;line-height:1.65;min-height:1.1em}
.line.empty{min-height:.85em}
.line.dim{color:var(--muted)}
.line.success{color:var(--green)}
.line.error{color:#f85149}
.line.warn{color:var(--gold)}

/* Inline helpers */
.c-cyan{color:var(--cyan)}
.c-green{color:var(--green)}
.c-gold{color:var(--gold)}

.c-dim{color:var(--muted)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Progress bars */

'use strict';

// ── Background rain ──────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('bg-canvas');
  const ctx=cv.getContext('2d');
  const chars='01アイウエオカキクケコABCDEF0123456789';
  let cols,drops;
  function resize(){
    cv.width=innerWidth;cv.height=innerHeight;
    cols=Math.floor(innerWidth/16);
    drops=Array.from({length:cols},()=>Math.random()*-100|0);
  }
  resize();addEventListener('resize',resize);
  let last=0;
  function draw(ts){
    if(document.hidden){requestAnimationFrame(draw);return}
    if(ts-last<80){requestAnimationFrame(draw);return}
    last=ts;
    ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#3fb950';ctx.font='13px JetBrains Mono,monospace';
    for(let i=0;i<cols;i++){
      ctx.fillText(chars[Math.random()*chars.length|0],i*16,drops[i]*16);
      if(drops[i]*16>cv.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ── Matrix fullscreen ────────────────────────────────────────────────────────
let matrixActive=false,matrixTimer=null;
(function(){
  const overlay=document.getElementById('matrix-overlay');
  const cv=document.getElementById('matrix-canvas');
  const ctx=cv.getContext('2d');
  const chars='アイウエオカキクケコサシスセソ0123456789ABCDEF';
  let cols,drops,raf;
  function resize(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(innerWidth/14);drops=Array(cols).fill(1)}
  function step(){
    ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font='13px JetBrains Mono,monospace';
    for(let i=0;i<cols;i++){
      ctx.fillStyle=Math.random()>.98?'#fff':'#3fb950';
      ctx.fillText(chars[Math.random()*chars.length|0],i*14,drops[i]*14);
      if(drops[i]*14>cv.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
    raf=requestAnimationFrame(step);
  }
  window.startMatrix=function(dur){
    if(matrixActive)return;
    matrixActive=true;resize();
    ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
    overlay.classList.add('active');step();
    if(dur)matrixTimer=setTimeout(stopMatrix,dur);
  };
  window.stopMatrix=function(){
    if(!matrixActive)return;
    matrixActive=false;cancelAnimationFrame(raf);
    overlay.classList.remove('active');
    if(matrixTimer){clearTimeout(matrixTimer);matrixTimer=null}
  };
  document.addEventListener('keydown',e=>{
    if(matrixActive&&e.key==='c'&&e.ctrlKey){e.preventDefault();stopMatrix()}
  });
  addEventListener('resize',()=>{if(matrixActive)resize()});
})();

// ── Terminal ─────────────────────────────────────────────────────────────────
const out=document.getElementById('output');
const inp=document.getElementById('cmd-input');
let hist=[],hIdx=-1;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function print(html,cls,delay){
  return new Promise(res=>{
    setTimeout(()=>{
      const s=document.createElement('span');
      s.className='line '+(cls||'');
      s.innerHTML=html;
      out.appendChild(s);
      out.scrollTop=out.scrollHeight;
      res();
    },delay||0);
  });
}
const nl=(d)=>print('','empty',d);

async function lines(arr,base,step){
  base=base||0;step=step||0;
  for(let i=0;i<arr.length;i++){
    const l=arr[i];
    if(typeof l==='string')await print(l,'',base+i*step);
    else await print(l.t||'',l.c||'',base+(l.d!=null?l.d:i*step));
  }
}

// ── Tab completion ────────────────────────────────────────────────────────────
const ALL=['help','whoami','ls','ls skills','ls projects','cat about.txt','cat cv.txt',
  'cat greenhouse.txt','cat reo-scanner.txt','cat cnc.txt','./experience','contact',
  'clear','matrix','sudo hire me','ping bekzat','nmap skills','date','uname','history','exit'];

function tabComplete(v){
  const m=ALL.filter(c=>c.startsWith(v));
  if(m.length===1)return m[0];
  if(m.length>1){
    print(m.join('  '),'dim');
    let pfx=m[0];for(const c of m)while(!c.startsWith(pfx))pfx=pfx.slice(0,-1);
    return pfx;
  }
  return v;
}

// ── Run command ───────────────────────────────────────────────────────────────
async function run(raw){
  const cmd=raw.trim();if(!cmd)return;
  hist.push(cmd);hIdx=-1;
  // echo
  const e=document.createElement('span');
  e.className='line cmd-echo';
  e.innerHTML='<span style="color:var(--cyan)">$</span> '+esc(cmd);
  out.appendChild(e);out.scrollTop=out.scrollHeight;

  const lo=cmd.toLowerCase();
  if(lo==='sudo hire me'||lo==='sudo hire'){await cmdHire();return}
  if(lo==='ping bekzat'||lo==='ping'){await cmdPing();return}
  if(lo==='nmap skills'||lo==='nmap'){await cmdNmap();return}

  const [v,...rest]=cmd.split(' ');const a=rest.join(' ');const vl=v.toLowerCase();
  if(vl==='help')await cmdHelp();
  else if(vl==='whoami')await cmdWhoami();
  else if(vl==='ls')await cmdLs(a);
  else if(vl==='cat')await cmdCat(a);
  else if(vl==='./experience'||vl==='experience')await cmdExperience();
  else if(vl==='contact')await cmdContact();
  else if(vl==='clear')await cmdClear();
  else if(vl==='matrix')await cmdMatrix();
  else if(vl==='exit'||vl==='quit')await cmdExit();
  else if(vl==='date')await cmdDate();
  else if(vl==='uname')await cmdUname();
  else if(vl==='echo')await cmdEcho(a);
  else if(vl==='history')await cmdHistory();
  else await print(`<span class="c-red">bash: ${esc(v)}: command not found</span> <span class="c-dim">— type <span class="c-cyan">help</span></span>`,'error');
}

// ── Input events ──────────────────────────────────────────────────────────────
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();const v=inp.value;inp.value='';run(v);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(!hist.length)return;
    if(hIdx===-1)hIdx=hist.length-1;else if(hIdx>0)hIdx--;
    inp.value=hist[hIdx];
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(hIdx===-1)return;
    if(hIdx<hist.length-1){hIdx++;inp.value=hist[hIdx]}else{hIdx=-1;inp.value=''}
  }else if(e.key==='Tab'){
    e.preventDefault();inp.value=tabComplete(inp.value);
  }else if(e.key==='c'&&e.ctrlKey){
    e.preventDefault();print('^C','dim');inp.value='';hIdx=-1;
  }else if(e.key==='l'&&e.ctrlKey){
    e.preventDefault();cmdClear();
  }
});

document.addEventListener('click',e=>{

document.querySelectorAll('.qbtn').forEach(b=>{
